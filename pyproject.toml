[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyscheme"
version = "0.1.0"
description = "Pick the Odds screen capture → Decision → Novig"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mss>=9.0.0",
  "Pillow>=10.0.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.26.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "rapidocr>=3.0.0",
  "onnxruntime>=1.17.0",
  "cryptography>=42.0.0",
  "requests>=2.31.0",
  "websocket-client>=1.7.0",
]

[project.scripts]
moneyscheme = "moneyscheme.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
